<div class="ogc-page" id="ogcRunsPage">
  <h1 class="ogc-title" id="ogcRunsTitle">Run</h1>
  <div class="ogc-sub" id="ogcRunsSub">Select baselines and reforms to run.</div>

  <div class="ogc-ctxbar">
    <span class="ogc-country-summary">
      <span class="ogc-country-flag" id="ogcRunCountryFlag"></span>
      <span class="ogc-country-copy">
        <b id="ogcRunCountryName"></b>
        <span class="ogc-country-code" id="ogcRunCountryId"></span>
      </span>
    </span>
  </div>

  <div class="ogc-editbar">
    <span class="ogc-eb-label" id="ogcAnalysisLabel">Analysis</span>
    <div class="ogc-seg ogc-seg-radio" role="radiogroup" aria-labelledby="ogcAnalysisLabel" aria-describedby="ogcAnalysisDescription">
      <input type="radio" name="ogcAnalysis" id="ogcAnalysisSteady" value="steady" checked>
      <label class="btn ogc-btn" for="ogcAnalysisSteady">Steady state</label>
      <input type="radio" name="ogcAnalysis" id="ogcAnalysisTransition" value="transition">
      <label class="btn ogc-btn" for="ogcAnalysisTransition">Transition path</label>
    </div>
    <span class="ogc-mut" id="ogcAnalysisDescription">Solve the long-run equilibrium. Required baselines use the same analysis.</span>
  </div>

  <div class="ogc-run-controls">
    <label><input type="checkbox" id="ogcForceRun"> Re-run completed selections</label>
    <span class="ogc-run-actions">
      <button class="btn ogc-btn ogc-btn-soft" id="ogcRefreshRuns" data-act="refresh" title="Refresh runs started or changed in another tab"><i class="fa fa-refresh"></i> Refresh</button>
      <button class="btn ogc-btn ogc-btn-danger" id="ogcCancelRun" data-act="cancel" style="display:none"><i class="fa fa-stop"></i> Cancel active runs</button>
      <button class="btn ogc-btn ogc-btn-main" id="ogcRunSelected" data-act="run-selected"><i class="fa fa-play"></i> Run selected</button>
    </span>
  </div>

  <div class="ogc-run-layout">
    <section class="ogc-run-panel">
      <h3><i class="fa fa-list"></i> Runs
        <button class="btn ogc-btn ogc-btn-sm ogc-btn-soft" id="ogcSelectAll" data-act="select-all"><i class="fa fa-check-square-o"></i> Select all</button>
      </h3>
      <table class="ogc-table ogc-run-table">
        <thead><tr><th></th><th>Name</th><th>Created from</th><th>State</th></tr></thead>
        <tbody id="ogcRunRows"></tbody>
      </table>
    </section>

    <section class="ogc-run-panel">
      <h3><i class="fa fa-tasks"></i> Run activity</h3>
      <div class="ogc-queue-section">
        <div class="ogc-queue-label">Current queue</div>
        <div id="ogcCurrentQueue"></div>
      </div>
      <div class="ogc-queue-section ogc-outcomes-section">
        <div class="ogc-queue-label">Latest outcomes</div>
        <div id="ogcRecentOutcomes"></div>
      </div>
    </section>
  </div>
</div>
